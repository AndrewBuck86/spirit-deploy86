name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: spirit-deploy86 # Reemplaza con tu ID de proyecto de GCP
  GAR_LOCATION: us-central1 # Región de Artifact Registry, consistente con tu zona GKE
  REPOSITORY: repo # Nombre de tu repositorio en Artifact Registry
  IMAGE_NAME: app # Nombre de la imagen Docker
  GKE_CLUSTER: mi-cluster-zonal # Nombre de tu clúster GKE
  GKE_ZONE: us-central1-c # Zona de tu clúster GKE

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Requerido para Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker to use Google Cloud CLI
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy to GKE
        run: |
          # Crea un archivo de despliegue temporal con la imagen actualizada
          sed "s|IMAGE_PLACEHOLDER|${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" deployment.yaml > deployment.updated.yaml
          kubectl apply -f deployment.updated.yaml
          kubectl rollout status deployment/app # Ajustado para coincidir con IMAGE_NAME si fuera el caso