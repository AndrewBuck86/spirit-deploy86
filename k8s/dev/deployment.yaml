apiVersion: apps/v1
kind: Deployment
metadata:
  name: spirit-app-dev
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spirit-app
  template:
    metadata:
      labels:
        app: spirit-app
    spec:
      containers:
      - name: spirit-app
        image: us-central1-docker.pkg.dev/spirit-deploy86/repo/app:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
