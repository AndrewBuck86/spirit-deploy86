apiVersion: apps/v1
kind: Deployment
metadata:
  name: spirit-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spirit-app
  template:
    metadata:
      labels:
        app: spirit-app
    spec:
      containers:
      - name: spirit-app
        image: us-central1-docker.pkg.dev/spirit-deploy86/repo/app:latest
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spirit-service
spec:
  type: LoadBalancer
  selector:
    app: spirit-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080